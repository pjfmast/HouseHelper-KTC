product:
  type: kmp/lib
  platforms: [ jvm, android, iosArm64, iosSimulatorArm64, wasmJs ]

dependencies:
  - $compose.runtime
  - $compose.foundation
  - $compose.material3
  - $compose.ui
  - $compose.components.resources
  - $compose.preview
  - $compose.hotReload.runtimeApi
  - $libs.compose.material.icons.core
  - $libs.androidx.lifecycle.viewmodel
  - $libs.androidx.lifecycle.viewmodel.compose
  - $libs.androidx.lifecycle.runtime.compose
  - $libs.androidx.navigation3.ui
  - $libs.androidx.lifecycle.viewmodel.navigation3
  - $libs.kotlinx.serialization.core
  - $libs.koin.core
  - $libs.koin.compose.viewmodel
  - $libs.koin.annotations
  - $libs.coil.compose
  - $libs.coil.network.ktor3

dependencies@android:
  - $compose.uiTooling
  # Use the latest stable Navigation 3 artifacts on Android; multiplatform targets use JetBrains 1.2.0.
  - $libs.androidx.navigation3.android.runtime
  - $libs.androidx.navigation3.android.ui
  - $libs.ktor.client.okhttp
  - $libs.koin.android

dependencies@jvm:
  - $compose.desktop.currentOs
  - $libs.kotlinx.coroutines.swing
  - $libs.ktor.client.okhttp
  - org.openjfx:javafx-base:23.0.2:win
  - org.openjfx:javafx-base:23.0.2:mac
  - org.openjfx:javafx-base:23.0.2:mac-aarch64
  - org.openjfx:javafx-base:23.0.2:linux
  - org.openjfx:javafx-graphics:23.0.2:win
  - org.openjfx:javafx-graphics:23.0.2:mac
  - org.openjfx:javafx-graphics:23.0.2:mac-aarch64
  - org.openjfx:javafx-graphics:23.0.2:linux
  - org.openjfx:javafx-swing:23.0.2:win
  - org.openjfx:javafx-swing:23.0.2:mac
  - org.openjfx:javafx-swing:23.0.2:mac-aarch64
  - org.openjfx:javafx-swing:23.0.2:linux
  - org.openjfx:javafx-media:23.0.2:win
  - org.openjfx:javafx-media:23.0.2:mac
  - org.openjfx:javafx-media:23.0.2:mac-aarch64
  - org.openjfx:javafx-media:23.0.2:linux

dependencies@ios:
  - $libs.ktor.client.darwin

test-dependencies:
  - $compose.uiTest

settings:
  compose:
    enabled: true
    resources:
      packageName: househelper.shared.generated.resources
      exposedAccessors: true
  kotlin:
    serialization: enabled
    compilerPlugins:
      - id: io.insert-koin.compiler.plugin
        dependency: $libs.koin.compiler.plugin
